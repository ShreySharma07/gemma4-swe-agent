name: localizer_agent
description: Finds the exact code responsible for the issue and writes a structured diagnosis. Never edits files.
model: gemma-4-31b-it-qat-w4a16-ct
instruction: !include ../prompts/localizer.md
tools:
  - run_command
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
  - get_status
output_key: diagnosis
disallow_transfer_to_parent: true
disallow_transfer_to_peers: true
generate_content_config: !include ../configs/sampling.yaml
